## Local LM config (JAX/Flax) — Hadamard-Signum arm (Sec. 2a of the revision plan)
## Copied verbatim from lm_signum.yaml (same hyperparameters). Only `optim` and the
## experiment names differ. LR is inherited from Signum for the first pass; per the
## plan the LR MAY be retuned for this arm (it is the one arm that might need it).

deterministic: False
seed: 0
force_cpu: False
matmul_precision: "highest"

# Dataset (HuggingFace datasets saved via data/datasets/prepare.py)
trainset_path: "data/datasets/outputs/fwedu/fwedu_sample_10BT_tokenizer_GPT2/tokenized_gpt2/ctx_2048/train"
validset_path: "data/datasets/outputs/fwedu/fwedu_sample_10BT_tokenizer_GPT2/tokenized_gpt2/ctx_2048/valid"
seq_len: 2048
vocab_size: 50257

intra_doc_masking: True
sampler: "sequential"
sampler_seed: 0
num_workers: 0

eval: True
valid_tokens: 200000
eval_every_steps: 100

model: "transformer"
d_model: 768
mlp_class: "glu"
expand: "8/3"
n_layers: 12
n_heads: 12
rms_norm: True
tie_embeddings: False
rope_theta: 500000.0
torch_compile: False

# Step budget = token_budget / (seq_len * micro_batch_size * grad_accumulation_steps * world_size)
steps_budget: 12700
micro_batch_size: 8
grad_accumulation_steps: 8

# choose between {float32, float16, bfloat16}
dtype: "bfloat16"

optim: hadamard_signum
fused_optim: False
# Inherited from Signum (see lm_signum.yaml). May be retuned for this arm only.
lr: 0.00006361387942129539
weight_decay: 0.217590785906466
beta1: 0.9
beta2: 0.95
signum_momentum: 0.8846546273088175
signum_nesterov: False

# --- Generic eigen tracking (works with any optimizer) ---
eigen_tracking_enabled: true
measurement_momentum: true
eigen_tracking_every: 576
eigen_tracking_measurement_mode: probe_update
eigen_tracking_topk: 5
eigen_tracking_extra_modes: 5
eigen_tracking_curvature_batches: 1
eigen_tracking_lanczos_iters: 10
eigen_tracking_backend: ggn
eigen_tracking_sort_by_abs: false
wasserstein_lm_top_k: 256
wasserstein_lm_max_positions: 512
wasserstein_graph_temp: 0.0
wasserstein_graph_eps: 1.e-6
wasserstein_laplacian_ridge: 1.e-4
eigen_tracking_light_ortho: false
eigen_tracking_light_ortho_every: 4
effective_curvature_tracking_enabled: true
# --- Revision Section 1 probe measures (participation ratio, AM trace, per-block) ---
eigen_tracking_hutchinson_probes: 32
eigen_tracking_block_measures: true

scheduler: "warmup_cosine"
warmup_steps: 0.05
cooldown_steps: null
lr_start: 0.0
lr_end: 1.e-5
lr_end_pct: null

log_every_steps: 25
print_progress: True

use_wandb: False
wandb_project: "llm"
wandb_dir: "./exp/llm/wandb"
wandb_run_name: "GGN_hadamard_signum"
exp_name: "GGN_hadamard_signum"
out_dir: "./exp/llm"
over_write: True

resume: False
resume_step: null
resume_exp_name: null

save_last_checkpoint: False
save_intermediate_checkpoints: False
save_every_steps: null
