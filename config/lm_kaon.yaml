## Local LM config (JAX/Flax) — Kaon arm (Sec. 2c of the revision plan)
## Copied verbatim from lm_muon.yaml (same hyperparameters). Only `optim` and the
## experiment names differ. Kaon keeps Muon's momentum and shape scaling but
## replaces the orthogonalized singular values with random positive noise, so
## Muon's LR transfers directly (exposure A/lambda_max is scale-invariant).

deterministic: False
seed: 0
force_cpu: False
matmul_precision: "highest"

# Dataset (HuggingFace datasets saved via data/datasets/prepare.py)
trainset_path: "data/datasets/outputs/fwedu/fwedu_sample_10BT_tokenizer_GPT2/tokenized_gpt2/ctx_2048/train"
validset_path: "data/datasets/outputs/fwedu/fwedu_sample_10BT_tokenizer_GPT2/tokenized_gpt2/ctx_2048/valid"
seq_len: 2048
vocab_size: 50257

intra_doc_masking: True
sampler: "sequential"
sampler_seed: 0
num_workers: 0

eval: True
valid_tokens: 200000
eval_every_steps: 100

model: "transformer"
d_model: 768
mlp_class: "glu"
expand: "8/3"
n_layers: 12
n_heads: 12
rms_norm: True
tie_embeddings: False
rope_theta: 500000.0
torch_compile: False

# Step budget = token_budget / (seq_len * micro_batch_size * grad_accumulation_steps * world_size)
steps_budget: 12700
micro_batch_size: 8
grad_accumulation_steps: 8

# choose between {float32, float16, bfloat16}
dtype: "bfloat16"

optim: kaon
fused_optim: False
# Inherited verbatim from Muon (see lm_muon.yaml); not retuned.
lr: 0.005618966095345044
# lr for the AdamW fallback branch (embeddings, lm_head, norms, biases), tuned
# independently of `lr` in config/lm_sweep_kaon.yaml.
# Comment out to fall back to the shared `lr`.
adam_fallback_lr: 0.0009790168681682325
weight_decay: 0.06915012753520602
beta1: 0.8945588884874422
beta2: 0.9624344365125296

muon_beta: 0.899692436989686
muon_ns_steps: 5
muon_ns_coeffs: [3.4445, -4.7750, 2.0315]
muon_nesterov: false
muon_adaptive: false
# Kaon-specific: distribution for the random positive singular values.
# {"halfnormal" -> |N(0,1)|, "exp" -> Exp(1)}; normalized to unit RMS.
kaon_sv_dist: "halfnormal"

# --- Generic eigen tracking (works with any optimizer) ---
eigen_tracking_enabled: true
# OFF at LM scale, on purpose. extract_precond_eigsystem allocates a dense
# (precond_criterion_max_dirs=40, num_params=162.1M) float32 Q_hat ~= 26 GB
# on the host at the first tracking step and OOM-holds the job
# (optim/eigentools.py:739); no request_memory can cover it. Feasible at
# ViT scale, where config/vit_tinyimagenet_ggn_*.yaml keep it enabled.
precond_criterion_enabled: false
measurement_momentum: true
eigen_tracking_every: 576
# Shared probe grid for every arm: steps 50, 626, 1202, ...
# 50 = (precondition_frequency + 2) + precondition_frequency/2 = 34 + 16, which
# puts SOAP at staleness 16 of 32 (mid-cycle) at EVERY probe, since
# 576 % 32 == 0. All arms use the identical grid, so cross-arm checkpoint
# clusters have diameter 0 instead of the old 34.
eigen_tracking_offset: 50
eigen_tracking_measurement_mode: probe_update
eigen_tracking_topk: 1
eigen_tracking_extra_modes: 0
eigen_tracking_curvature_batches: 8
eigen_tracking_lanczos_iters: 10
eigen_tracking_backend: ggn
eigen_tracking_sort_by_abs: false
wasserstein_lm_top_k: 256
wasserstein_lm_max_positions: 512
wasserstein_graph_temp: 0.0
wasserstein_graph_eps: 1.e-6
wasserstein_laplacian_ridge: 1.e-4
eigen_tracking_light_ortho: false
eigen_tracking_light_ortho_every: 4
effective_curvature_tracking_enabled: true
# --- Revision Section 1 probe measures (participation ratio, AM trace, per-block) ---
eigen_tracking_hutchinson_probes: 32
eigen_tracking_block_measures: true

scheduler: null
warmup_steps: 0.05
cooldown_steps: null
lr_start: 0.0
lr_end: 1.e-5
lr_end_pct: null

log_every_steps: 25
print_progress: True

use_wandb: False
wandb_project: "llm"
wandb_dir: "./exp/llm/wandb"
wandb_run_name: "GGN_kaon"
wandb_unique_names: True
exp_name: "GGN_kaon"
out_dir: "./exp/llm"
over_write: True

resume: False
resume_step: null
resume_exp_name: null

save_last_checkpoint: False
save_intermediate_checkpoints: False
save_every_steps: null
