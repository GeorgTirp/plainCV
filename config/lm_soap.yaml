## Local LM config (JAX/Flax)
## Update trainset_path/validset_path to match your prepared dataset outputs.

deterministic: False
seed: 0
force_cpu: False
matmul_precision: "highest"

# Dataset (HuggingFace datasets saved via data/datasets/prepare.py)
# Example output structure:
# data/datasets/outputs/<dataset_name>/tokenized_<tokenizer_name>/ctx_<seq_len>/train
trainset_path: "data/datasets/outputs/fwedu/fwedu_sample_10BT_tokenizer_GPT2/tokenized_gpt2/ctx_2048/train"
validset_path: "data/datasets/outputs/fwedu/fwedu_sample_10BT_tokenizer_GPT2/tokenized_gpt2/ctx_2048/valid"
#trainset_path: "data/datasets/outputs/wikitext2/tokenized_gpt2/ctx_128/train"
#validset_path: "data/datasets/outputs/wikitext2/tokenized_gpt2/ctx_128/valid"
seq_len: 2048
vocab_size: 50257



intra_doc_masking: True
sampler: "sequential"
sampler_seed: 0
num_workers: 0

eval: True
valid_tokens: 200000
eval_every_steps: 100

model: "transformer"
d_model: 768
mlp_class: "glu"
expand: "8/3"
n_layers: 12
n_heads: 12
rms_norm: True
tie_embeddings: False
rope_theta: 500000.0
torch_compile: False

# Step budget = token_budget / (seq_len * micro_batch_size * grad_accumulation_steps * world_size)
steps_budget: 12700
micro_batch_size: 8
grad_accumulation_steps: 8

# choose between {float32, float16, bfloat16}
dtype: "bfloat16"

optim: soap
fused_optim: False
#lr: 0.00021140560730609868
lr: 0.0005142138854798203
# lr for the AdamW fallback branch (embeddings, lm_head, norms, biases),
# tuned independently of `lr` in config/lm_sweep_soap.yaml.
# Comment out to fall back to the shared `lr`.
adam_fallback_lr: 0.00031840895804913845
weight_decay: 0.13914417230329906
beta1: 0.8625334043673486
beta2: 0.8665023323380612
eps: 3.63444592438095e-8

precondition_frequency: 32
shampoo_beta2: 0.8622990269332041

# --- Generic eigen tracking (works with any optimizer) ---
eigen_tracking_enabled: true
measurement_momentum: true
eigen_tracking_every: 576
# Shared probe grid for every arm: steps 50, 626, 1202, ...
# 50 = (precondition_frequency + 2) + precondition_frequency/2 = 34 + 16, which
# puts SOAP at staleness 16 of 32 (mid-cycle) at EVERY probe, since
# 576 % 32 == 0. All arms use the identical grid, so cross-arm checkpoint
# clusters have diameter 0 instead of the old 34.
eigen_tracking_offset: 50
eigen_tracking_measurement_mode: probe_update
eigen_tracking_post_soap_refresh: false
eigen_tracking_topk: 1
eigen_tracking_extra_modes: 0
eigen_tracking_curvature_batches: 8
eigen_tracking_lanczos_iters: 10
eigen_tracking_backend: ggn
eigen_tracking_sort_by_abs: false
wasserstein_lm_top_k: 256
wasserstein_lm_max_positions: 512
wasserstein_graph_temp: 0.0
wasserstein_graph_eps: 1.e-6
wasserstein_laplacian_ridge: 1.e-4
eigen_tracking_light_ortho: false
eigen_tracking_light_ortho_every: 4
effective_curvature_tracking_enabled: true
# ON since the sparse rewrite (B). extract_precond_directions keeps SOAP's
# believed basis in its Kronecker generator form (u_i, v_j per direction) and
# precond_criterion_from_directions materializes one direction at a time as a
# params-shaped pytree, so the dense (M, 162.1M) float32 Q_hat ~= 26 GB that
# used to OOM-hold this job is never allocated. Cost is M curvature matvecs per
# measurement.
precond_criterion_enabled: true
# M/2 top + M/2 bottom of the believed spectrum: top-only samples only the stiff
# end, where the preconditioner is least wrong, so it cannot see calibration.
precond_criterion_stratified: true
precond_criterion_max_dirs: 32
precond_criterion_damping: 1.e-6
# Section 4 (SOAP believed-basis vs GGN eigenvectors): the O(k*m^2*n^2) einsum
# hang was fixed (compute_soap_perlayer_sin2 now uses two batched matmuls,
# O(k*m*n*(m+n))). It is memory-light and now runs under pmap, so enable it.
soap_perlayer_sin2_enabled: true
# --- Revision Section 1 probe measures (participation ratio, AM trace, per-block) ---
eigen_tracking_hutchinson_probes: 32
eigen_tracking_block_measures: true
# A6 native-frame decomposition (SVD of each namesake block + 2x8 probe draws).
# The one measurement item that is not free: ~16 extra curvature products and
# one SVD per routed block per probe.
native_frame_enabled: false
native_frame_draws: 8
# A10 probe-batch transfer: 8 batches held out from the fixed curvature probe.
probe_transfer_batches: 8

scheduler: "warmup_cosine"
warmup_steps: 0.05
cooldown_steps: null
lr_start: 0.0
lr_end: 1.e-5
lr_end_pct: null

log_every_steps: 25
print_progress: True

use_wandb: False
wandb_project: "llm"
wandb_dir: "./exp/llm/wandb"
wandb_run_name: "WASSERSTEIN_soap"
wandb_unique_names: True
exp_name: "WASSERSTEIN_soap"
out_dir: "./exp/llm"
over_write: True

resume: False
resume_step: null
resume_exp_name: null

save_last_checkpoint: False
save_intermediate_checkpoints: False
save_every_steps: null
