# sweep.yaml
program: train_lm.py
method: bayes
metric:
  # NOT `eval_loss`: define_metric("eval_loss", summary="min") stores that as
  # {"min": ...}, which does not resolve to a number, leaving the sweep with
  # no objective (server-side bestLoss stayed 0/None). train.py and
  # train_lm.py log `best_eval_loss` as a running min, so the run summary
  # holds a plain float that any sweep controller can read.
  name: best_eval_loss
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - -u
  - ${program}
  - --config=config/lm_soap.yaml

parameters:
  # Use names that match keys in the base config YAML.
  # lr drives the SOAP (2D kernel) branch only.
  lr:
    distribution: log_uniform_values
    min: 1.0e-7
    max: 3.0e-2

  # Independent lr for the AdamW fallback branch (embeddings, lm_head, norms,
  # biases). Sampled separately from `lr` so the two branches are not forced
  # to share an optimum.
  adam_fallback_lr:
    distribution: log_uniform_values
    min: 1.0e-7
    max: 3.0e-2

  weight_decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.30

  beta1:
    distribution: uniform
    min: 0.75
    max: 0.95

  beta2:
    distribution: uniform
    min: 0.85
    max: 0.995

  eps:
    distribution: log_uniform_values
    min: 1.0e-10
    max: 1.0e-6

  precondition_frequency:
    values: [32]

  shampoo_beta2:
    distribution: uniform
    min: 0.85
    max: 0.999

  soap_log_skipped:
    values: [false]

  # Curvature measurement is a post-tuning protocol — far too expensive to carry
  # through a sweep (config/lm_soap.yaml enables it for the paper runs, incl.
  # soap_perlayer_sin2). Matches what the ViT sweeps already do.
  eigen_tracking_enabled:
    value: false

  effective_curvature_tracking_enabled:
    value: false

  use_wandb:
    value: true

run_cap: 32
