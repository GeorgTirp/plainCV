# W&B Bayesian sweep — Signum on ViT-S/4 / CIFAR-10
# Register with:  wandb sweep config/vit_sweep_signum.yaml
# Then update nc_sweep_vit_signum.sub with the returned sweep ID.
program: train.py
method: bayes
metric:
  name: eval_loss
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - -u
  - ${program}
  - --config=config/vit_tinyimagenet_ggn_signum.yaml

parameters:
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-2

  weight_decay:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 0.1

  signum_momentum:
    distribution: uniform
    min: 0.75
    max: 0.99

  # Disable eigentracking during sweep — too expensive
  eigen_tracking_enabled:
    value: false

  effective_curvature_tracking_enabled:
    value: false

  num_epochs:
    value: 30

  use_wandb:
    value: true

  wandb_project:
    value: vit-tinyimagenet-tune

run_cap: 30
