program: train_lm.py
method: bayes
metric:
  name: best_eval_loss
  goal: minimize
command:
- ${env}
- ${interpreter}
- -u
- ${program}
- --config=config/lm_hadamard_signum.yaml
parameters:
  lr:
    distribution: log_uniform_values
    min: 1.0e-06
    max: 0.03
  weight_decay:
    distribution: log_uniform_values
    min: 0.005
    max: 0.25
  signum_momentum:
    distribution: uniform
    min: 0.75
    max: 0.99
  eigen_tracking_enabled:
    value: false
  effective_curvature_tracking_enabled:
    value: false
  use_wandb:
    value: true
  precond_criterion_enabled:
    value: false
  wandb_project:
    value: tune-hadamard-signum-lm-fwedu-16
run_cap: 16
