program: train.py
method: bayes
metric:
  name: best_eval_loss
  goal: minimize
command:
- ${env}
- ${interpreter}
- -u
- ${program}
- --config=config/vit_tinyimagenet_ggn_sgd.yaml
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.5
  weight_decay:
    distribution: log_uniform_values
    min: 1.0e-05
    max: 0.1
  sgd_momentum:
    distribution: uniform
    min: 0.5
    max: 0.99
  sgd_nesterov:
    value: false
  eigen_tracking_enabled:
    value: false
  effective_curvature_tracking_enabled:
    value: false
  num_epochs:
    value: 30
  use_wandb:
    value: true
  wandb_project:
    value: tune-sgd-vit-tinyimagenet-16
  precond_criterion_enabled:
    value: false
  hessian_probe_enabled:
    value: false
run_cap: 16
