seed: 0
print_progress: true

dataset: "tiny_imagenet"
batch_size: 128
image_size: 64
num_epochs: 40
num_channels: 3
num_classes: 200

# ViT-S/4 (6L, no-norm): ~10.8M params on 64x64x3 (256 patches + CLS = 257 tokens)
model: "vit"
vit_patch_size: 4
vit_hidden_size: 384
vit_mlp_dim: 1536
vit_layers: 6
vit_heads: 6
vit_dropout: 0.2
vit_use_layernorm: true
vit_use_batchnorm: false

optim: soap
lr: 0.0003151516887393953
weight_decay: 0.09006476081934933
beta1: 0.7760361639771391
beta2: 0.981660653958689

muon_beta: 0.95
muon_ns_steps: 5
muon_ns_coeffs: [3.4445, -4.7750, 2.0315]
muon_nesterov: true
muon_adaptive: false

signum_momentum: 0.9
signum_nesterov: false

precondition_frequency: 25
shampoo_beta2: 0.851106956428801

# GGN eigentracking — SOAP phase triplet schedule
eigen_tracking_enabled: true
measurement_momentum: true
eigen_tracking_schedule: soap_phases
eigen_tracking_every: 500
eigen_tracking_cycle_stride: 500
eigen_tracking_phase_offsets: [0, 12, 24]
eigen_tracking_measurement_mode: probe_update
eigen_tracking_post_soap_refresh: false
eigen_tracking_topk: 15
eigen_tracking_extra_modes: 5
eigen_tracking_lanczos_iters: 20
eigen_tracking_backend: ggn
eigen_tracking_sort_by_abs: false
eigen_tracking_light_ortho: false
eigen_tracking_light_ortho_every: 4
precond_criterion_enabled: true

# Effective curvature tracking
effective_curvature_tracking_enabled: true
effective_curvature_transform_base: zero
effective_curvature_direction_scale: 1.0
effective_curvature_normalize_lr: true
effective_curvature_gram_ridge: 1.0e-8

# Hessian probe (robustness check on ~5 checkpoints)
hessian_probe_enabled: true
hessian_probe_count: 5

exp_name: "GGN_vit_tinyimagenet_soap_triplet_effective"
out_dir: "./exp/vit_tinyimagenet"
use_wandb: false
